# ZÁMĚRNĚ špatná práce se secrets — AC6.
# 1) Hodnoty jsou jen base64 (NE šifrování) — k3s bez --secrets-encryption je drží
#    v plaintextu v datastore (sqlite/etcd).
# 2) Secret je do podu předaný jako ENV proměnné (viz envFrom v 01-workload.yaml),
#    takže uniká v `kubectl describe pod`, v `env` uvnitř kontejneru i do logů potomků.
# POZOR: hodnoty jsou FAKE, jen pro demonstraci na vlastní VM.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: insecure-demo
type: Opaque
stringData:
  DB_PASSWORD: "S3cr3t-DB-Heslo-FAKE"
  API_KEY: "sk_live_FAKE_0123456789abcdef"
