#  - v datastore jsou šifrované, protože secure cluster běží s --secrets-encryption
#    (ověřuje 06-secret-defense.sh přes `k3s secrets-encrypt status`).
#  - RBAC (02-rbac-minimal.yaml) aplikaci čtení secrets přes API ZAKAZUJE.
# POZOR: hodnoty jsou FAKE, jen pro demonstraci na vlastní VM.
apiVersion: v1
kind: Secret
metadata:
  name: safeapp-secrets
  namespace: secure-demo
type: Opaque
stringData:
  DB_PASSWORD: "S3cr3t-DB-Heslo-FAKE"
  API_KEY: "sk_live_FAKE_0123456789abcdef"
